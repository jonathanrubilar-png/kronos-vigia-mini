name: Vigía del Mac mini

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar el latido del mini
        env:
          GIST_ID:          ${{ secrets.GIST_ID }}
          GIST_TOKEN:       ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash vigia.sh

      - name: Guardar el estado
        if: env.CAMBIO == '1'
        run: |
          git config user.name  "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add estado/
          git diff --staged --quiet || git commit -m "estado del vigía: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
