name: Vigía del Mac mini

# Por qué existe (02-ago-2026):
# El Mac mini es el punto fijo — corre KRONOS y los 13 agentes de producción de
# OdontoCloud (recordatorios de WhatsApp a pacientes, confirmaciones,
# calendar-sync, respaldos). Si se cae, con FileVault se queda en la pantalla de
# desbloqueo y NINGÚN agente arranca, en silencio.
#
# Ya existe un vigía local en el MacBook Pro 2018 (com.vigia.mini), pero ese
# equipo es un PORTÁTIL QUE DUERME: puede estar dormido justo cuando el mini se
# cae. Este workflow mira desde fuera y no duerme nunca.
#
# Los dos conviven a propósito: el local avisa rápido cuando está despierto,
# este garantiza que el aviso llegue igual.

on:
  schedule:
    - cron: '*/20 * * * *'     # cada 20 min (GitHub suele retrasarlos; el umbral es de 45)
  workflow_dispatch:            # para probarlo a mano desde la pestaña Actions

permissions:
  contents: write               # para guardar el estado entre corridas

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer el latido y decidir
        env:
          GIST_ID:          ${{ secrets.GIST_ID }}
          GIST_TOKEN:       ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail

          UMBRAL=2700       # 45 min sin latido = problema (el mini late cada 10)
          ESPERADOS=25      # 11 protectores KRONOS + 13 de OdontoCloud + el latido
          RECORDAR=21600    # si sigue caído, repetir el aviso cada 6 h
          PING=604800       # señal de vida propia una vez por semana

          avisar() {
            [ -n "${TELEGRAM_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ] || {
              echo "::error::faltan credenciales de Telegram"; return 1; }
            curl -s --max-time 20 \
              "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$1" > /dev/null
          }

          # --- leer el latido del gist -------------------------------------
          # Si GitHub no contesta, el problema es de AQUÍ, no del mini: se calla.
          # Un vigía que avisa en falso deja de leerse.
          CONTENIDO=$(curl -s --max-time 25 \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['files']['latido.txt']['content'])" 2>/dev/null)

          if [ -z "$CONTENIDO" ]; then
            echo "sin acceso al gist — no se concluye nada"
            exit 0
          fi

          EPOCH=$(printf '%s\n' "$CONTENIDO" | sed -n 's/^epoch=//p' | tr -d '[:space:]')
          AGENTES=$(printf '%s\n' "$CONTENIDO" | sed -n 's/^agentes=//p' | tr -d '[:space:]')
          case "$EPOCH" in ''|*[!0-9]*) echo "latido ilegible"; exit 0 ;; esac

          AHORA=$(date +%s)
          EDAD=$(( AHORA - EPOCH ))
          MIN=$(( EDAD / 60 ))

          # Los mensajes se arman con \n explícitos y NO con saltos de línea
          # reales: dentro de un bloque `run: |` de YAML, una línea que empiece
          # en la columna 0 CIERRA el bloque y parte el script en dos. Se
          # detectó al validar la sintaxis antes de publicar.
          NL=$'\n'
          PROBLEMA=""
          if [ "$EDAD" -gt "$UMBRAL" ]; then
            PROBLEMA="🔴 EL MINI NO DA SEÑALES desde hace $MIN min.  [vigía externo]${NL}${NL}Los recordatorios de WhatsApp, las confirmaciones y el calendar-sync están PARADOS.${NL}${NL}Causa más probable: se reinició y está en la pantalla de FileVault. Los agentes no arrancan hasta que alguien desbloquee la sesión a mano.${NL}${NL}Qué hacer: ir al mini, desbloquear, y comprobar que salgan 25 con:${NL}  launchctl list | grep -c odontocloud"
          elif printf '%s' "$AGENTES" | grep -qE '^[0-9]+$' && [ "$AGENTES" -lt "$ESPERADOS" ]; then
            PROBLEMA="🟡 El mini responde, pero solo tiene $AGENTES de $ESPERADOS agentes cargados.  [vigía externo]${NL}${NL}Alguno se cayó o no se cargó. Revisar allá con:${NL}  launchctl list | grep -E 'com.(kronos|odontocloud).'"
          fi

          # --- máquina de estados: avisar en el cambio, no en cada pasada ---
          ANTERIOR=$(cat estado/ultimo.txt 2>/dev/null | head -1)
          ULTIMO=$(cat estado/ultimo.txt 2>/dev/null | sed -n '2p')
          case "${ULTIMO:-}" in ''|*[!0-9]*) ULTIMO=0 ;; esac
          : "${ANTERIOR:=OK}"

          CAMBIO=0
          if [ -n "$PROBLEMA" ]; then
            if [ "$ANTERIOR" != "ALERTA" ] || [ $(( AHORA - ULTIMO )) -gt "$RECORDAR" ]; then
              avisar "$PROBLEMA" && echo "aviso enviado (edad=${MIN}m agentes=$AGENTES)"
              printf 'ALERTA\n%s\n' "$AHORA" > estado/ultimo.txt; CAMBIO=1
            else
              echo "sigue caído (edad=${MIN}m) — ya avisado, en silencio"
            fi
          else
            if [ "$ANTERIOR" = "ALERTA" ]; then
              avisar "🟢 El mini volvió. $AGENTES agentes cargados, último latido hace $MIN min.  [vigía externo]"
              CAMBIO=1
            fi
            printf 'OK\n%s\n' "$AHORA" > estado/ultimo.txt
            echo "OK (edad=${MIN}m agentes=$AGENTES)"
          fi

          # --- señal de vida del propio vigía, una vez por semana ----------
          # GitHub DESACTIVA los workflows programados tras 60 días sin actividad
          # en el repo. Si eso pasa, este vigía muere en silencio — justo lo que
          # vino a evitar. El ping semanal es el canario: si deja de llegar, es
          # que el vigía dejó de correr.
          ULTIMO_PING=$(cat estado/ultimo_ping.txt 2>/dev/null | tr -d '[:space:]')
          case "${ULTIMO_PING:-}" in ''|*[!0-9]*) ULTIMO_PING=0 ;; esac
          if [ $(( AHORA - ULTIMO_PING )) -gt "$PING" ]; then
            avisar "🔵 Vigía externo del mini: vivo. Último latido hace $MIN min, $AGENTES agentes.${NL}(este mensaje llega una vez por semana; si deja de llegar, el vigía se apagó)"
            printf '%s\n' "$AHORA" > estado/ultimo_ping.txt; CAMBIO=1
          fi

          echo "CAMBIO=$CAMBIO" >> "$GITHUB_ENV"

      - name: Guardar el estado
        if: env.CAMBIO == '1'
        run: |
          git config user.name  "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add estado/
          git diff --staged --quiet || git commit -m "estado del vigía: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
